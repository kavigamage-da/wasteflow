services:
  db:
    image: postgres:16-alpine
    container_name: wasteflow-db
    environment:
      POSTGRES_USER: wasteflow
      POSTGRES_PASSWORD: wasteflow
      POSTGRES_DB: wasteflow
    ports:
      - "5432:5432"
    volumes:
      - wasteflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasteflow -d wasteflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wasteflow-db-data:
